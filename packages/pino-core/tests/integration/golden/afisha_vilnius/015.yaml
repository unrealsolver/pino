text: 'Выставка молодого художника Повиласа Дуды в галерее (AV17), где он показывает
  свой дипломный проект: реальные отпечатки с поверхностей садовых домиков советских
  коллективных садов и документальный фильм с воспоминаниями местных жителей. Проект
  исследует исчезающую среду, личную и коллективную память и входит в программу VDA
  Graduation Show. 📍Адрес: Totorių 5 ⏰12:00-19:00, добавить в 📆 На LT/EN, подробности
