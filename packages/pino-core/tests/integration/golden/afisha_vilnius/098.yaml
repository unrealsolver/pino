text: 'Цикл встреч для обсуждения произведений искусства с помощью метода визуального
  мышления. Каждый месяц участники вместе рассматривают и обсуждают два произведения,
  делясь личными впечатлениями и интерпретациями, без специальных знаний об искусстве.
  Модерация — на английском и литовском языках, участвовать можно на любом из них.
  Проходит в Национальной галерее искусств каждую первую субботу месяца в 16:00, вход
  по билету галереи, требуется регистрация. Где: Konstitucijos pr. 22 ⏰16:00-17:00,
  добавить в 📆 На LT/EN, подробности Дата: #7февраля #7марта #4апреля #2мая #6июня
  #5сентября #3октября #7ноября #5декабря Теги для поиска: #беседы #Общение #неМТ
