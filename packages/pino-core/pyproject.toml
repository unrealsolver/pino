[project]
name = "pino-core"
version = "0.1.0"
description = "Core services and models for Pino."
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "httpx",
    "pillow",
    "pino-llm",
    "psycopg[binary]",
    "pydantic",
    "pyyaml",
    "sqlalchemy",
]

[tool.uv.sources]
pino-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pino_core"]
