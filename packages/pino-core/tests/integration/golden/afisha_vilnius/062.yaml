text: 'Семейный день в Исторических домах Национального музея Литвы, посвящённый культуре
  северояпонского народа айну и её параллелям с древними литовскими традициями. В
  программе: экскурсии по выставке об айнах, занятия о мифических существах, творческие
  мастерские (бумажные духи kamuy, манга, народные инструменты, татуировки), кулинарные
  мастер-классы по аинуской кухне и игровые/образовательные активности для детей разного
  возраста и подростков. Регистрация. Где: Parodų erdvė Istorijų namai / House of
