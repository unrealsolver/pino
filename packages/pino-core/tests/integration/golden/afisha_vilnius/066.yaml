text: 'Привет! Это Паша и я подготовил новый Афишный поход на велосипедах! 🚴 Начало
  #7июня (воскресенье) в 11:30 Маршрут 27км Рассказываю: встретимся мы на заправке
  и поедем в сторону Зелёных озёр🌊, по лесопарку, попробуем объехать сразу два озера
  (Gulbinai + Balsys), возле одного из озёр сделаем небольшой перерыв, поедим, кто
  захочет сможет искупаться🏊, на обратном пути предложу свернуть возле Веркяйского
  замка, там будет красивый вид, где-то велик точно нужно будет провести в руках,
  трасса однозначно не будет скучной и поездка станет небольшим приключением, присоединяйтесь!
  Для тех, кто сомневается в своих силах: из опыта что я видел, ~30км может проехать
  примерно каждый, даже самый не тренированный, тут идея в том чтобы не спешить и
  не ехать голодным, будет 1 или 2 перерыва чтоб все могли отдохнуть 💯 Теги: #поход
  #спорт #неЛТ #Общение'
