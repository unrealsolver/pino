text: Это Паша, кто не знает, Афишу я и Яна ведём уже чуть больше года, раньше её
  делала гид Анна, раньше по ~1500 человек просматривали каждый пост, а сейчас примерно
  в два раза меньше, где-то с каналом мы не справляемся, статистика говорит сама за
  себя. Недавно я пересёкся с человеком, который раньше активно пользовался Афишей,
  а сейчас перестал, я у него спросил, почему перестал пользоваться конкретно он?
  Как ощущалось и ощущается пользование Афишей? Ну и много открытых вопросов, он мне
  ответил то, о чём я и подумать не мог (расскажу вам о его ответах и принятых решениях
  чуть позже, но они были безумно полезны). У меня к вам большая просьба, вспомните
  тех ваших друзей, которые знают об Афише, спросите их, а пользуются ли они ещё?
  Если они ответят нет или редко, могут ли они рассказать почему? Перед этим усердно
  подумав, какая всё-таки истинная причина, это очень важно. Чем развёрнутее ответ,
  тем лучше. Попросите их написать мне @pavel0529 текстом или аудюшкой их мысли, спасибо!
  Ивенты на эти выходные я уже опубликовал, сегодня и завтра новых постов на канале
  не будет. Спасибо, что остаётесь с Афишей!
