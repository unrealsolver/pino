[project]
name = "pino-llm"
version = "0.1.0"
description = "Unified LLM interface and provider adapters for Pino."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pino_llm"]

