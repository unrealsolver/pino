name: Checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.10.2'
          python-version: '3.12'
          enable-cache: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.5'
      - run: uv sync --frozen --all-packages
      - run: uv run --frozen ruff check .
      - run: uv run --frozen python -m pytest -q
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run test && bun run build
        working-directory: web
      - name: Python advisory report (non-blocking)
        id: python_audit
        continue-on-error: true
        run: uvx pip-audit==2.9.0 --path .venv/lib/python3.12/site-packages
      - name: Frontend advisory report (non-blocking)
        id: frontend_audit
        continue-on-error: true
        run: bun audit
        working-directory: web
      - name: Advisory summary
        if: always()
        env:
          PYTHON_RESULT: ${{ steps.python_audit.outcome }}
          FRONTEND_RESULT: ${{ steps.frontend_audit.outcome }}
        run: |
          printf '### Dependency audits (report-only)\nPython: %s\nFrontend: %s\n\nFailure means advisories **or audit failure**; inspect logs.\n' \
            "$PYTHON_RESULT" "$FRONTEND_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7
