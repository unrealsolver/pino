text: '12-ого июня в 12.00 состоится экскурсия по кварталу Стикляй с посещением здания,
  где была типография Франциска Скорины, и готических подвалов🔥🔥🔥 Квартал - одно из
  старейших мест в Вильнюсе, который раньше имел и другое название - латинский квартал,
  так как почти всегда здесь большую часть населения составляли иностранцы, которые
  подарили Вильнюсу много новшеств. А еще он может похвастаться и потрясающей историей:
  стеклодувы, золотых дел мастера, еврейские лавочки, современное искусство и ремесла.
  📍Место встречи: Ратушная площадь 🗓️Дата: #12июня (пятница) в 12.00 🗣️Язык экскурсии
