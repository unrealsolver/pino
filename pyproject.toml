[project]
name = "pino-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "prek",
    "pytest",
    "ruff",
]

[tool.uv]
package = false
constraint-dependencies = [
    "beautifulsoup4==4.14.3",
    "httpx==0.28.1",
    "prek==0.4.1",
    "pydantic==2.13.4",
    "pytest==9.0.3",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "ruff==0.15.13",
    "sqlalchemy==2.0.49",
    "telethon==1.43.2",
    "typer==0.25.1",
]

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
