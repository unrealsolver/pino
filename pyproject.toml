[project]
name = "pino-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "prek>=0.4.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

