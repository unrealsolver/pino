storage:
  path: .pino/pino.sqlite

llm:
  default_provider: echo
  model: null
  temperature: 0.1
  top_p: 0.1
  providers:
    infercom:
      base_url: https://api.infercom.ai/v1
      api_key_file: INFERCOM_API_KEY
      models:
        smart: MiniMax-M2.5
        simple: gpt-oss-120b
      default_model: smart
    ollama:
      base_url: http://localhost:11434
      models:
        smart: gpt-oss-20b
        simple: gpt-oss-20b
      default_model: smart
    echo:
      enabled: true
      default_model: echo

chat:
  history_limit: 20
  max_tool_rounds: 2

evaluation:
  model: simple
  batch_size: 10
  goals:
    - name: meet_people
      description: Social occasions in Vilnius where Boss could meet women or new people.
    - name: metal_music
      description: Metal music concerts, festivals, or meetups.
    - name: electronic_music
      description: Electronic music events, especially synth-related events.
    - name: open_synth_jam
      description: Open synth jam, participatory music jam, or similar events.
    - name: volunteering_community
      description: Volunteering, community work, initiatives, workshops, or gatherings.

sources:
  - name: sample
    type: static_yaml
    path: samples/fake-source.yaml
  - name: kaveikti-vilnius
    type: kaveikti
    url: https://www.kaveikti.lt/renginiai/vilniuje
    enabled: false
  - name: vilnius-events
    type: vilnius_events
    url: https://www.vilnius-events.lt/en/
    enabled: false
