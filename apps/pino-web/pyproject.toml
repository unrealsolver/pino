[project]
name = "pino-web"
version = "0.1.0"
description = "Web API for inspecting Pino events."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pino-core",
    "uvicorn",
]

[project.scripts]
pino-web = "pino_web.main:main"

[tool.uv.sources]
pino-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pino_web"]
