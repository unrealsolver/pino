text: 'Обмен вещами и мини-рынок: по воскресеньям в «Утопии» можно бесплатно приносить
  и менять одежду, аксессуары и домашний текстиль, а также покупать вещи у местных
  дизайнеров и художников под музыку диджея. Продавцам нужна регистрация. От Яны:
  на мероприятии можно взять себе бесплатно новую/почти новую одежду без запаха секонда
  или подарить её другим, есть очень хорошие вещи (сама набрала 4 и очень ими довольна),
  рекомендую всем, кто хочет обновку, которая не увеличивает количество текстильного
  мусора на планете🔥🔥. Однако учитывайте, что ивент на улице и примерочных кабинок
  там нет, а музыка довольно громкая. Организаторы каждый раз публикуют новый ивент
  вместо группировки, постить их 100500 раз мы скорее всего не будем, но они проходят
  всё лето каждое воскресенье с 13 до 17, можно проверить в фейсбуке по организатору.
  📍Адрес: T. Kosciuškos g. 1 Дата: #14июня #21июня #28июня (воскресенье) ⏰13:00-17:00,
  добавить в 📆 На LT языке, подробности Теги для поиска: #swapparty #Развлечения #неМТ
  #Вильнюс'
