[project]
name = "pino-core"
version = "0.1.0"
description = "Core services and models for Pino."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pino_core"]

