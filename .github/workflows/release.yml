name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, e.g. 0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pino-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.10.2'
          python-version: '3.12'
          enable-cache: true
      - name: Package and smoke-test installation
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release.py pack "v$VERSION"
          read -r checksum filename < "dist/pino-v$VERSION.tar.gz.sha256"
          prepared="$RUNNER_TEMP/pino-v$VERSION"
          python3 scripts/release.py unpack "dist/pino-v$VERSION.tar.gz" "$checksum" "$prepared" "v$VERSION"
          uv sync --frozen --all-packages --no-dev --project "$prepared"
          "$prepared/.venv/bin/pino-web" --help
          "$prepared/.venv/bin/pino" db --help
      - name: Publish tested release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # Creating an existing tag fails; never move tags or overwrite release assets.
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          gh release create "$tag" "dist/pino-$tag.tar.gz" "dist/pino-$tag.tar.gz.sha256" \
            --verify-tag --draft --title "$tag" --notes "Tested commit: $GITHUB_SHA"
          gh release edit "$tag" --draft=false
