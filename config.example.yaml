media:
  directory: .pino/media
  public_url: /media

storage:
  use: local
  local:
    type: sqlite
    path: .pino/pino.sqlite
  pg_vps:
    type: postgres
    url: null

llm:
  roles:
    chat: echo:default
    refine: echo:default
  models:
    echo:
      default:
        model: echo
    minimax:
      schedule-m3:
        model: MiniMax-M3
        temperature: 1
        top_p: 0.95
    ollama:
      schedule-fast:
        model: gemma4:e4b
        temperature: 0
        think: false
        num_ctx: 4096
        num_predict: 768
      schedule-accurate:
        model: gpt-oss:20b
        temperature: 1
        top_p: 0.95
        think: low
        num_ctx: 32768
        num_predict: 2048
  providers:
    minimax:
      base_url: https://api.minimax.io/v1
      api_key: env:MINIMAX_API_KEY
    infercom:
      base_url: https://api.infercom.ai/v1
      api_key: env:INFERCOM_API_KEY
    ollama:
      base_url: http://localhost:11434

chat:
  history_limit: 20
  active_memory_limit: 20
  max_tool_rounds: 2
  max_tools_per_round: 3

refinement:
  batch_size: 10
  schema_version: 1
  taxonomy_version: 1
  categories:
    - name: social
      description: Social occasions with natural conversation or opportunities to meet people.
    - name: metal_music
      description: Metal music concerts or festivals.
    - name: electronic_music
      description: Electronic music events, especially synth-related music.
    - name: open_synth_jam
      description: Open synth jams, participatory music jams, or similar events.
    - name: live_music
      description: Live music performances.
    - name: volunteering
      description: Volunteering or community work.
    - name: community
      description: Community initiatives or gatherings.
    - name: workshop
      description: Participatory workshops.
    - name: theatre
      description: Theatre performances.
    - name: pottery
      description: Pottery workshops or gatherings.
    - name: dating
      description: Events explicitly intended for dating or meeting potential partners.

profile:
  goals:
    - name: meet_people
      description: Social occasions in Vilnius where Boss could meet women or interesting new people, including small workshops, tastings, cultural salons, lectures, niche gatherings, volunteering, community events, and other settings with natural conversation.
    - name: metal_music
      description: Metal music concerts, festivals, or meetups.
    - name: electronic_music
      description: Electronic music events, especially synth-related events.
    - name: open_synth_jam
      description: Open synth jam, participatory music jam, or similar events.
    - name: volunteering_community
      description: Volunteering, community work, initiatives, workshops, or gatherings.

sources:
  - name: sample
    type: static_yaml
    path: samples/fake-source.yaml
  - name: kaveikti-vilnius
    type: kaveikti
    url: https://www.kaveikti.lt/renginiai/vilniuje
    enabled: false
  - name: vilnius-events
    type: vilnius_events
    url: https://www.vilnius-events.lt/en/
    enabled: false
  - name: afisha-vilnius
    type: telegram_channel
    url: https://t.me/afishavilnius
    settings:
      api_id: env:TELEGRAM_API_ID
      api_hash: env:TELEGRAM_API_HASH
      session_path: .pino/telegram
      limit: 50
      qc: afisha_vilnius
    enabled: false
  - name: reforumspace-vilnius
    type: telegram_channel
    url: https://t.me/reforumspace
    settings:
      api_id: env:TELEGRAM_API_ID
      api_hash: env:TELEGRAM_API_HASH
      session_path: .pino/telegram
      limit: 50
      location_scopes:
        - LT/vilnius
    enabled: false
  - name: vilnius-belarus
    type: telegram_channel
    url: https://t.me/Vilnius_Belarus
    settings:
      api_id: env:TELEGRAM_API_ID
      api_hash: env:TELEGRAM_API_HASH
      session_path: .pino/telegram
      limit: 50
      location_scopes:
        - LT/vilnius
    enabled: false
