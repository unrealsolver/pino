[project]
name = "pino-integration"
version = "0.1.0"
description = "Third-party source integrations for Pino."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "httpx",
    "pino-core",
]

[tool.uv.sources]
pino-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pino_integration"]
